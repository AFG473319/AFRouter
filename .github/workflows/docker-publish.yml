name: Build and Push Docker Image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to publish (e.g. 0.5.91). Leave empty for a latest-only build from the default branch."
        required: false
        type: string

env:
  DOCKERHUB_IMAGE: afg473319/afrouter

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Docker Hub is optional: the account may not exist and the secrets may
      # never have been added. GHCR always works (automatic GITHUB_TOKEN), so
      # without Hub credentials we publish GHCR-only instead of failing the job.
      - name: Decide target registries
        id: registries
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Registry references must be LOWERCASE. github.repository is
          # "AFG473319/AFRouter", and while metadata-action/build-push-action
          # lowercase the image tags for us, cache-from/cache-to are forwarded to
          # buildx verbatim — which failed every image build since v0.5.90 with
          # "repository name (AFG473319/AFRouter) must be lowercase".
          GHCR_IMAGE="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "ghcr_image=$GHCR_IMAGE" >> "$GITHUB_OUTPUT"
          # `images` is a comma-separated list and `dockerhub` is a SEPARATE
          # output. Writing the marker into the same heredoc made metadata-action
          # parse "dockerhub=false" as an image attribute and fail with
          # "Unknown image attribute" before the build ever started.
          IMAGES="$GHCR_IMAGE"
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            IMAGES="$IMAGES,${{ env.DOCKERHUB_IMAGE }}"
            echo "dockerhub=true" >> "$GITHUB_OUTPUT"
          else
            echo "dockerhub=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Docker Hub credentials absent - publishing GHCR only. Add DOCKERHUB_USERNAME and DOCKERHUB_TOKEN repository secrets to also push afg473319/afrouter."
          fi
          echo "images=$IMAGES" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: steps.registries.outputs.dockerhub == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.registries.outputs.images }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=${{ inputs.version || 'unused' }},enable=${{ inputs.version != null && inputs.version != '' }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ steps.registries.outputs.ghcr_image }}:buildcache
          cache-to: type=registry,ref=${{ steps.registries.outputs.ghcr_image }}:buildcache,mode=max
          platforms: linux/amd64,linux/arm64
          provenance: false
          sbom: false
