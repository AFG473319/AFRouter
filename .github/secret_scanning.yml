# GitHub secret scanning configuration.
#
# The provider registry and its test fixtures contain Google's *public*
# installed-app OAuth clients, which are published in Google's own open-source
# projects and are not confidential:
#
#   - Antigravity / CLIProxyAPI client (antigravity, shared.js)
#   - gemini-cli client: google-gemini/gemini-cli
#     packages/core/src/code_assist/oauth2.ts
#
# GitHub matches these on the GOCSPX- pattern alone and cannot tell a
# public-by-design client from a user-owned secret, so they re-alert on every
# edit. They are expected values, not leaked credentials.
paths-ignore:
  - open-sse/providers/shared.js
  - open-sse/providers/registry/antigravity.js
  - open-sse/providers/registry/gemini.js
  - open-sse/providers/registry/gemini-cli.js
  - tests/unit/antigravity-oauth-client.test.js
  - tests/__baseline__/providers-baseline.json
